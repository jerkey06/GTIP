services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtip}
      POSTGRES_DB: ${POSTGRES_DB:-gtip}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtip} -d ${POSTGRES_DB:-gtip}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gtip}:${POSTGRES_PASSWORD:-gtip}@db:5432/${POSTGRES_DB:-gtip}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gtip}:${POSTGRES_PASSWORD:-gtip}@db:5432/${POSTGRES_DB:-gtip}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
