services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtip}
      POSTGRES_DB: ${POSTGRES_DB:-gtip}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtip} -d ${POSTGRES_DB:-gtip}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Aplica las migraciones una sola vez antes de arrancar api y worker (ADD §14.3).
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gtip}:${POSTGRES_PASSWORD:-gtip}@db:5432/${POSTGRES_DB:-gtip}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gtip}:${POSTGRES_PASSWORD:-gtip}@db:5432/${POSTGRES_DB:-gtip}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ingestas periódicas (APScheduler) y manuales (solicitudes en PostgreSQL), ADR-02.
  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gtip}:${POSTGRES_PASSWORD:-gtip}@db:5432/${POSTGRES_DB:-gtip}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Frontend compilado servido por nginx, que reenvía /api a la API.
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
